# A deliberately tiny workload. The point is not what it runs - it is that the
# replica count here is the ONLY thing that decides how many pods exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      # The cluster node is arm64. nginx:alpine is multi-arch, so it runs; a
      # single-arch amd64 image would sit Pending with a node-affinity message
      # that never mentions architecture.
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        # nginx-unprivileged, NOT the standard nginx image.
        #
        # Standard nginx crash-loops under a hardened securityContext: its
        # entrypoint chowns /var/cache/nginx, which needs CAP_CHOWN, and
        # dropping ALL capabilities takes that away:
        #
        #   [emerg] chown("/var/cache/nginx/client_temp", 101) failed
        #   (1: Operation not permitted)
        #
        # The usual "fix" is to add CAP_CHOWN back, which quietly undoes the
        # hardening. This image is built to need none of it - it already runs as
        # an unprivileged user and writes nothing it does not own.
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 8080, not 80: an unprivileged process cannot bind a port below 1024.
          ports:
            - containerPort: 8080
          # Small on purpose: this shares a 2 vCPU / 4 GB node with Argo CD,
          # cloudprice and all of kube-system.
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
                
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: demo
spec:
  selector: { app: hello }
  ports:
    - port: 80
      targetPort: 8080
